<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Shifts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Shifts</h1>
    <table class="table table-striped">
        <thead>
        <tr><th>ID</th><th>Driver</th><th>Zone</th><th>Date</th><th>Start</th><th>End</th><th>Aktion</th></tr>
        </thead>
        <tbody>
        <tr th:each="shift : ${shifts}">
            <td th:text="${shift.id}"></td>
            <td th:text="${shift.driver.firstName + ' ' + shift.driver.lastName}"></td>
            <td th:text="${shift.zone.name}"></td>
            <td th:text="${shift.deploymentDate}"></td>
            <td th:text="${shift.startTime}"></td>
            <td th:text="${shift.endTime}"></td>
            <td>
                <form th:action="@{/shifts/{id}/delete(id=${shift.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-danger btn-sm">Löschen</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/shifts/new" class="btn btn-primary">New Shift</a>
    <a href="/" class="btn btn-secondary">Dashboard</a>
</div>
</body>
</html>
