<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Driver</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:if="${driver == null}">New Driver</h1>
    <h1 th:if="${driver != null}">Edit Driver</h1>
    <form th:action="${driver != null ? '/drivers/' + driver.id : '/drivers'}" method="post">
        <div class="mb-3">
            <label class="form-label">Name</label>
        <input type="text" name="firstName" th:value="${driver != null ? driver.firstName : ''}" required />
        <input type="text" name="lastName" th:value="${driver != null ? driver.lastName : ''}" required />
        </div>
        <button type="submit" class="btn btn-success" th:text="${driver != null ? 'Update' : 'Save'}">Save</button>
        <a href="/drivers" class="btn btn-secondary">Back</a>
    </form>
</div>
</body>
</html>
