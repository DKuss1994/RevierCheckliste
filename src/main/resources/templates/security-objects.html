<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sicherheitsobjekte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Sicherheitsobjekte</h1>
    <table class="table table-striped">
        <thead>
        <tr><th>Name</th><th>Zone</th><th>Aktionen</th></tr>
        </thead>
        <tbody>
        <tr th:each="obj : ${objects}">
            <td th:text="${obj.name}"></td>
            <td th:text="${obj.zone.name}"></td>
            <td>
                <a th:href="@{/security-objects/{id}/edit(id=${obj.id})}" class="btn btn-sm btn-primary">Edit</a>
                <form th:action="@{/security-objects/{id}/delete(id=${obj.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Löschen?')">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/security-objects/new" class="btn btn-primary">Neues Objekt</a>
    <a href="/" class="btn btn-secondary">Dashboard</a>
</div>
</body>
</html>
