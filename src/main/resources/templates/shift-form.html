<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Shift</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>New Shift</h1>
    <form action="/shifts" method="post">
        <div class="mb-3">
            <label class="form-label">Driver</label>
            <select name="driverId" class="form-select" required>
                <option value="">-- Select --</option>
                <option th:each="driver : ${drivers}"
                        th:value="${driver.id}"
                        th:text="${driver.firstName + ' ' + driver.lastName}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Zone</label>
            <select name="zoneId" class="form-select" required>
                <option value="">-- Select --</option>
                <option th:each="zone : ${zones}"
                        th:value="${zone.id}"
                        th:text="${zone.name}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Datum (YYYY-MM-DD)</label>
            <input type="date" name="deploymentDate" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Startzeit (HH:MM)</label>
            <input type="time" name="startTime" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Endzeit (HH:MM)</label>
            <input type="time" name="endTime" class="form-control" required/>
        </div>
        <button type="submit" class="btn btn-success">Save</button>
        <a href="/shifts" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
