<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Zones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Zones</h1>
    <table class="table">
        <thead>
        <tr><th>ID</th><th>Name</th><th>Aktion</th></tr>
        </thead>
        <tbody>
        <tr th:each="zone : ${zones}">
            <td th:text="${zone.id}"></td>
            <td th:text="${zone.name}"></td>
            <td>
                <a th:href="@{/zones/{id}/edit(id=${zone.id})}" class="btn btn-sm btn-primary">Edit</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/zones/new" class="btn btn-success">Add Zone</a>
    <a href="/" class="btn btn-secondary mb-3">← Dashboard</a>
</div>
</body>
</html>
