<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${zone != null ? 'Edit Zone' : 'New Zone'}">Zone Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:text="${zone != null ? 'Edit Zone' : 'New Zone'}">Zone Form</h1>
    <form th:action="@{${zone != null ? '/zones/' + zone.id : '/zones'}}" method="post">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" th:value="${zone != null ? zone.name : ''}" required/>
        </div>
        <button type="submit" class="btn btn-success">Save</button>
        <a href="/zones" class="btn btn-secondary">Back</a>
    </form>
</div>
</body>
</html>
