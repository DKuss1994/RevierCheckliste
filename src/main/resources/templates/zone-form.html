<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:if="${zone == null}">New Zone</title>
    <title th:if="${zone != null}">Edit Zone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:if="${zone == null}">New Zone</h1>
    <h1 th:if="${zone != null}">Edit Zone</h1>
    <form th:action="${zone != null ? '/zones/' + zone.id : '/zones'}" method="post">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" th:value="${zone != null ? zone.name : ''}" class="form-control" required/>
        </div>
        <button type="submit" class="btn btn-success" th:text="${zone != null ? 'Update' : 'Save'}">Save</button>
        <a href="/zones" class="btn btn-secondary">Back</a>
    </form>
</div>
</body>
</html>
