version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: securitydispatch-db
    environment:
      POSTGRES_DB: securitydispatch
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d securitydispatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: securitydispatch-app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod

volumes:
  postgres_data: